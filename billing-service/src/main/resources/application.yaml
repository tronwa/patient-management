spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      schema: billing_service_schema
      connection-init-sql: SET search_path TO billing_service_schema
    flyway:
      enabled: true
      schemas: billing_service_schema
      create-schemas: true
      execute-in-transaction: false
      baseline-on-migrate: true
  sql:
    init:
      mode: always
  docker:
    compose:
      file: docker/docker-compose.yaml
  rabbitmq:
    host: ${RABBIT_HOST}
    port: 5672
    username: ${RABBIT_DEFAULT_USER}
    password: ${RABBIT_DEFAULT_PASS}

# swagger-ui custom path
springdoc:
  swagger-ui:
    path: /swagger-ui.html
