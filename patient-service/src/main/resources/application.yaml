spring:
  application:
    name: patient-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      auto-commit: false
      schema: patient_service_schema
      connection-init-sql: SET search_path TO patient_service_schema
  flyway:
    enabled: true
    schemas: patient_service_schema
    create-schemas: true
    execute-in-transaction: false
    baseline-on-migrate: false

server:
  port: 8081
  sql:
    init:
      mode: always
  rabbitmq:
    host: ${RABBIT_HOST}
    port: 5672
    username: ${RABBIT_DEFAULT_USER}
    password: ${RABBIT_DEFAULT_PASS}

# swagger-ui custom path
springdoc:
  swagger-ui:
    path: /swagger-ui.html
