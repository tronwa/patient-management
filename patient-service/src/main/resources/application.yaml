spring:
  application:
    name: patient-service
  datasource:
    hikari:
      auto-commit: false
      schema: patient_service_schema
      connection-init-sql: SET search_path TO patient_service_schema
  flyway:
    enabled: true
    schemas: patient_service_schema
    create-schemas: true
    execute-in-transaction: false
    baseline-on-migrate: false
  sql:
    init:
      mode: always
  docker:
    compose:
      file: docker/docker-compose.yaml
